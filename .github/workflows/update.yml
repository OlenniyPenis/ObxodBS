name: Update site status

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Count entries in sub.txt
        shell: bash
        run: |
          set -e

          if [ ! -f sub.txt ]; then
            echo "sub.txt not found"
            exit 1
          fi

          # Считаем непустые строки в обычном текстовом файле.
          COUNT=$(grep -cve '^[[:space:]]*$' sub.txt || true)

          UPDATED=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          cat > status.json <<EOF
          {
            "online": true,
            "title": "ObxodBS by Edicoral",
            "configs": $COUNT,
            "updated": "$UPDATED"
          }
          EOF

          echo "Entries in sub.txt: $COUNT"
          cat status.json

      - name: Commit status
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add status.json

          if git diff --cached --quiet; then
            echo "Nothing to update"
            exit 0
          fi

          git commit -m "Update site status"
          git push
