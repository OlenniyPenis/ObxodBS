name: Auto Update Test

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Скачать свежий файл
        run: |
          curl -L --fail \
            "https://raw.githubusercontent.com/github/gitignore/main/README.md" \
            -o test.txt

      - name: Сохранить результат
        uses: actions/upload-artifact@v4
        with:
          name: updated-file
          path: test.txt
