<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ObxodBS by Edicoral</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family: Arial, sans-serif;

      background: #0b0d10;
      color: #f1f1f1;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 650px;
    }

    .card {
      background: #15181d;

      border: 1px solid #292e36;
      border-radius: 20px;

      padding: 30px;

      box-shadow:
        0 15px 50px rgba(0, 0, 0, .35);
    }

    .logo {
      font-size: 42px;

      text-align: center;

      margin-bottom: 8px;
    }

    h1 {
      margin: 0;

      text-align: center;

      font-size: 30px;
    }

    .subtitle {
      color: #9299a5;

      text-align: center;

      margin-top: 8px;
      margin-bottom: 28px;
    }

    .status {
      padding: 18px;

      border-radius: 14px;

      background: #102417;
      color: #6cff91;

      font-weight: bold;
      font-size: 18px;

      text-align: center;

      margin-bottom: 20px;
    }

    .status.offline {
      background: #281616;
      color: #ff7777;
    }

    .status.maintenance {
      background: #281616;
      color: #ff7777;
    }

    .status.loading {
      background: #1c2027;
      color: #9299a5;
    }

    .maintenance-message {
      background: #1c2027;

      border-radius: 14px;

      padding: 20px;

      color: #d7dbe1;

      line-height: 1.6;

      text-align: center;

      margin-bottom: 15px;
    }

    .total {
      background: #1c2027;

      border-radius: 14px;

      padding: 20px;

      text-align: center;

      margin-bottom: 15px;
    }

    .total-label {
      color: #9299a5;

      font-size: 14px;
    }

    .total-value {
      font-size: 36px;

      font-weight: bold;

      margin-top: 6px;
    }

    .source {
      background: #1c2027;

      padding: 15px;

      border-radius: 12px;

      margin-top: 10px;
    }

    .source-title {
      font-weight: bold;
    }

    .source-info {
      color: #9299a5;

      margin-top: 6px;

      font-size: 14px;

      line-height: 1.6;
    }

    .source-ok {
      color: #6cff91;
    }

    .source-error {
      color: #ff7777;
    }

    .button {
      display: block;

      text-align: center;

      text-decoration: none;

      background: #242932;
      color: white;

      padding: 15px;

      border-radius: 12px;

      margin-top: 22px;

      font-size: 16px;
      font-weight: bold;
    }

    .button:hover {
      background: #303641;
    }

    .footer {
      text-align: center;

      color: #626a76;

      margin-top: 20px;

      font-size: 13px;

      line-height: 1.5;
    }

    .hidden {
      display: none;
    }

  </style>

</head>


<body>

<div class="container">

  <div class="card">

    <div class="logo">
      🛡️
    </div>

    <h1>
      ObxodBS
    </h1>

    <div class="subtitle">
      by Edicoral
    </div>


    <!-- СТАТУС -->

    <div
      id="status"
      class="status loading"
    >
      ⏳ ПРОВЕРКА СИСТЕМЫ...
    </div>


    <!-- СООБЩЕНИЕ ТЕХРАБОТ -->

    <div
      id="maintenanceMessage"
      class="maintenance-message hidden"
    >

      <strong>
        СЕРВИС ВРЕМЕННО ПРИОСТАНОВЛЕН
      </strong>

      <br>
      <br>

      Воркер устал, ждите фикс!

      <br>
      <br>

      Вся свежая информация в ТГК

    </div>


    <!-- ОСНОВНАЯ ИНФОРМАЦИЯ -->

    <div id="mainContent">


      <!-- ОБЩЕЕ КОЛИЧЕСТВО -->

      <div class="total">

        <div class="total-label">
          ВСЕГО КОНФИГОВ
        </div>

        <div
          id="total"
          class="total-value"
        >
          —
        </div>

      </div>


      <!-- ИСТОЧНИКИ -->

      <div id="sources"></div>


      <!-- ПОСЛЕДНЕЕ ОБНОВЛЕНИЕ -->

      <div class="source">

        <div class="source-title">
          🕐 Последнее обновление
        </div>

        <div
          id="updated"
          class="source-info"
        >
          —
        </div>

      </div>


      <!-- КНОПКА ПОДПИСКИ -->

      <a
        class="button"
        href="sub.txt"
        target="_blank"
      >
        🔗 ПОЛУЧИТЬ ПОДПИСКУ
      </a>

    </div>


    <!-- FOOTER -->

    <div class="footer">

      ObxodBS • Edicoral

      <br>

      Статус обновляется автоматически

    </div>

  </div>

</div>


<script>

  async function loadStatus() {

    const statusElement =
      document.getElementById("status");

    const maintenanceMessage =
      document.getElementById("maintenanceMessage");

    const mainContent =
      document.getElementById("mainContent");

    const totalElement =
      document.getElementById("total");

    const sourcesElement =
      document.getElementById("sources");

    const updatedElement =
      document.getElementById("updated");


    try {

      /*
       * Получаем status.json
       */

      const response =
        await fetch(
          "status.json?t=" + Date.now(),
          {
            cache: "no-store"
          }
        );


      if (!response.ok) {

        throw new Error(
          "status.json unavailable"
        );

      }


      const data =
        await response.json();


      /*
       * =================================
       * ТЕХНИЧЕСКИЕ РАБОТЫ
       * =================================
       */

      if (data.maintenance === true) {

        statusElement.className =
          "status maintenance";

        statusElement.textContent =
          "🔴 ТЕХНИЧЕСКИЕ РАБОТЫ";


        maintenanceMessage.classList.remove(
          "hidden"
        );

        mainContent.classList.add(
          "hidden"
        );


        return;
      }


      /*
       * Если техработы выключены
       */

      maintenanceMessage.classList.add(
        "hidden"
      );

      mainContent.classList.remove(
        "hidden"
      );


      /*
       * =================================
       * ОБЩИЙ СТАТУС
       * =================================
       */

      if (data.online === true) {

        statusElement.className =
          "status";

        statusElement.textContent =
          "🟢 СИСТЕМА РАБОТАЕТ";

      } else {

        statusElement.className =
          "status offline";

        statusElement.textContent =
          "🔴 ЕСТЬ ПРОБЛЕМЫ";

      }


      /*
       * =================================
       * ОБЩЕЕ КОЛИЧЕСТВО
       * =================================
       */

      totalElement.textContent =
        Number.isFinite(data.configs)
          ? data.configs
          : "—";


      /*
       * =================================
       * ИСТОЧНИКИ
       * =================================
       */

      sourcesElement.innerHTML = "";


      if (
        Array.isArray(data.sources) &&
        data.sources.length > 0
      ) {

        data.sources.forEach(
          (source, index) => {

            const block =
              document.createElement("div");

            block.className =
              "source";


            const name =
              source.name ||
              `Источник ${index + 1}`;


            const configs =
              source.configs !== undefined
                ? source.configs
                : "—";


            const updated =
              source.updated &&
              source.updated !== ""
                ? source.updated
                : "—";


            const online =
              source.online !== false;


            block.innerHTML = `

              <div class="source-title">
                ${name}
              </div>

              <div class="source-info">

                <span class="${
                  online
                    ? "source-ok"
                    : "source-error"
                }">

                  ${
                    online
                      ? "🟢 Источник работает"
                      : "🔴 Источник недоступен"
                  }

                </span>

                <br>

                📦 Конфигов:
                ${configs}

                <br>

                🕐 Обновление:
                ${updated}

              </div>

            `;


            sourcesElement.appendChild(
              block
            );

          }
        );

      }


      /*
       * =================================
       * ОБЩЕЕ ВРЕМЯ ОБНОВЛЕНИЯ
       * =================================
       */

      if (data.updated) {

        const date =
          new Date(data.updated);


        if (
          !Number.isNaN(
            date.getTime()
          )
        ) {

          updatedElement.textContent =
            date.toLocaleString(
              "ru-RU",
              {
                dateStyle: "medium",
                timeStyle: "short"
              }
            );

        } else {

          updatedElement.textContent =
            data.updated;

        }

      } else {

        updatedElement.textContent =
          "—";

      }


    } catch (error) {

      console.error(
        "Status error:",
        error
      );


      /*
       * Если status.json недоступен
       */

      statusElement.className =
        "status offline";

      statusElement.textContent =
        "🔴 ОШИБКА ПРОВЕРКИ";


      maintenanceMessage.classList.add(
        "hidden"
      );

      mainContent.classList.remove(
        "hidden"
      );


      totalElement.textContent =
        "—";


      sourcesElement.innerHTML = "";


      updatedElement.textContent =
        "—";

    }

  }


  /*
   * Первый запуск
   */

  loadStatus();


  /*
   * Обновление каждые 60 секунд
   */

  setInterval(
    loadStatus,
    60000
  );

</script>

</body>

</html>
