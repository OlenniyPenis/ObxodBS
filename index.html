<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ObxodBS by Edicoral</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 16px;

      font-family: Arial, sans-serif;

      background: #0b0d10;
      color: #f1f1f1;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 520px;
    }

    .card {
      background: #15181d;
      border: 1px solid #292e36;
      border-radius: 18px;

      padding: 24px;

      box-shadow:
        0 15px 50px rgba(0, 0, 0, .35);
    }

    .logo {
      text-align: center;
      font-size: 48px;
      margin-bottom: 4px;
    }

    h1 {
      text-align: center;
      margin: 0;
      font-size: 28px;
    }

    .subtitle {
      text-align: center;
      color: #9299a5;
      margin-top: 7px;
      margin-bottom: 24px;
    }

    .status {
      padding: 14px;
      border-radius: 12px;

      text-align: center;
      font-weight: bold;

      margin-bottom: 16px;

      background: #102417;
      color: #6cff91;
    }

    .status.offline {
      background: #281616;
      color: #ff7777;
    }

    .status.loading {
      background: #1c2027;
      color: #aeb5c0;
    }

    .total {
      background: #1c2027;
      border-radius: 14px;

      padding: 20px;

      text-align: center;
      margin-bottom: 14px;
    }

    .total-label {
      color: #9299a5;
      font-size: 14px;
    }

    .total-value {
      font-size: 38px;
      font-weight: bold;
      margin-top: 5px;
    }

    .info {
      background: #1c2027;
      border-radius: 12px;

      padding: 15px;
      margin-top: 10px;
    }

    .info-title {
      font-weight: bold;
      margin-bottom: 7px;
    }

    .info-text {
      color: #9299a5;
      font-size: 14px;
      line-height: 1.6;
    }

    .button {
      display: block;

      text-align: center;
      text-decoration: none;

      background: #242932;
      color: white;

      padding: 15px;

      border-radius: 12px;

      margin-top: 20px;

      font-size: 16px;
      font-weight: bold;

      transition: background .15s;
    }

    .button:hover {
      background: #303641;
    }

    .footer {
      text-align: center;

      color: #626a76;

      margin-top: 20px;

      font-size: 13px;
      line-height: 1.5;
    }

    .error {
      color: #ff7777;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="card">

    <div class="logo">
      🛡️
    </div>

    <h1>
      ObxodBS
    </h1>

    <div class="subtitle">
      by Edicoral
    </div>


    <div
      id="status"
      class="status loading"
    >
      ⏳ ПРОВЕРКА СИСТЕМЫ...
    </div>


    <div class="total">

      <div class="total-label">
        ВСЕГО КОНФИГОВ
      </div>

      <div
        id="total"
        class="total-value"
      >
        —
      </div>

    </div>


    <div class="info">

      <div class="info-title">
        📡 Статус сервиса
      </div>

      <div
        id="serviceInfo"
        class="info-text"
      >
        Проверка...
      </div>

    </div>


    <div class="info">

      <div class="info-title">
        🕐 Последнее обновление
      </div>

      <div
        id="updated"
        class="info-text"
      >
        Проверка...
      </div>

    </div>


    <a
      class="button"
      href="sub.txt"
      target="_blank"
    >
      🔗 ПОЛУЧИТЬ ПОДПИСКУ
    </a>


    <div class="footer">
      ObxodBS • Edicoral
      <br>
      Статус обновляется автоматически
    </div>

  </div>

</div>


<script>

async function loadStatus() {

  const statusElement =
    document.getElementById("status");

  const totalElement =
    document.getElementById("total");

  const serviceInfo =
    document.getElementById("serviceInfo");

  const updatedElement =
    document.getElementById("updated");


  try {

    /*
     * Загружаем status.json
     * напрямую с GitHub Pages.
     *
     * Никакого Worker здесь нет.
     */

    const statusResponse =
      await fetch(
        "status.json?t=" + Date.now(),
        {
          cache: "no-store"
        }
      );


    if (!statusResponse.ok) {
      throw new Error("status.json unavailable");
    }


    const status =
      await statusResponse.json();


    /*
     * Загружаем sub.txt
     * с этого же GitHub Pages.
     */

    const subResponse =
      await fetch(
        "sub.txt?t=" + Date.now(),
        {
          cache: "no-store"
        }
      );


    let configs = 0;


    if (subResponse.ok) {

      const text =
        await subResponse.text();


      /*
       * Считаем строки конфигураций.
       */

      configs =
        text
          .split(/\r?\n/)
          .filter(line => {

            const value =
              line.trim().toLowerCase();

            return (
              value.startsWith("vless://") ||
              value.startsWith("vmess://") ||
              value.startsWith("trojan://") ||
              value.startsWith("ss://")
            );

          })
          .length;
    }


    /*
     * Статус
     */

    if (status.online === true) {

      statusElement.className =
        "status";

      statusElement.textContent =
        "🟢 СИСТЕМА РАБОТАЕТ";

      serviceInfo.innerHTML =
        "🟢 Сервис доступен";

    } else {

      statusElement.className =
        "status offline";

      statusElement.textContent =
        "🔴 СЕРВИС НЕДОСТУПЕН";

      serviceInfo.innerHTML =
        '<span class="error">🔴 Сервис недоступен</span>';
    }


    /*
     * Количество конфигов
     */

    totalElement.textContent =
      configs;


    /*
     * Дата обновления
     */

    if (status.updated) {

      const date =
        new Date(status.updated);

      updatedElement.textContent =
        date.toLocaleString(
          "ru-RU",
          {
            dateStyle: "medium",
            timeStyle: "short"
          }
        );

    } else {

      updatedElement.textContent =
        "дата не указана";
    }


  } catch (error) {

    console.error(error);


    statusElement.className =
      "status offline";

    statusElement.textContent =
      "🔴 ОШИБКА ПРОВЕРКИ";


    serviceInfo.innerHTML =
      '<span class="error">🔴 Не удалось получить данные</span>';


    totalElement.textContent =
      "—";


    updatedElement.textContent =
      "нет данных";
  }

}


/*
 * Запуск
 */

loadStatus();


/*
 * Автообновление каждые 60 секунд
 */

setInterval(
  loadStatus,
  60000
);

</script>

</body>
</html>
